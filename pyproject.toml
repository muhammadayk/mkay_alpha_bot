[project]
name = "mkay-web3-opportunity-radar"
version = "0.1.0"
description = "Free-first, review-first Web3 opportunity collector"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
radar = "mkay_radar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

