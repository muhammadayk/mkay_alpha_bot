name: Collect Airdrops.io

on:
  schedule:
    # Every six hours. Times are UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # These versions use GitHub's current Node 24 action runtime.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m mkay_radar.cli collect-all
        env:
          PYTHONPATH: src
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRYPTOJOBSLIST_API_KEY: ${{ secrets.CRYPTOJOBSLIST_API_KEY }}
          RADAR_USER_AGENT: ${{ vars.RADAR_USER_AGENT }}
          RADAR_MAX_ITEMS_PER_RUN: "10"
          RADAR_REQUEST_DELAY_SECONDS: "1"
      - run: python -m mkay_radar.cli review --limit 10 --send
        env:
          PYTHONPATH: src
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
